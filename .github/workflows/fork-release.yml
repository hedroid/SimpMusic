name: Fork Release (arm64 APK)

# Fork 发布线(2026-09-25):上游 android-release.yml 依赖一整套我们没配的 secrets
# (Sentry/Conveyor/双变体矩阵)且只传 artifacts 不建 Release,不适合直接复用。
# 本工作流按 fork 打包定案执行:只打 arm64-v8a full release、跳过 Sentry 上传、
# zipalign+apksigner 手动签名(与本地 build_and_sign 流程一致)、直接创建 GitHub
# Release 并附 APK。所需 secrets:KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS
# / KEY_PASSWORD(已配在 hedroid/SimpMusic)。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空 = v{version-name}）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & publish arm64 release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > simpmusic.jks

      - name: Read app version
        id: ver
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Build arm64 release APK
        run: ./gradlew :androidApp:assembleRelease -x uploadSentryProguardMappingsRelease --console=plain

      - name: Zipalign & sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          SRC="androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release-unsigned.apk"
          test -f "$SRC" || { echo "::error::$SRC not found"; exit 1; }
          OUT="SimpMusic-v${{ steps.ver.outputs.version }}-arm64-release.apk"
          "$BT/zipalign" -f -p 4 "$SRC" "$OUT"
          "$BT/apksigner" sign \
            --ks simpmusic.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            "$OUT"
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          ls -lh "$OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || format('v{0}', steps.ver.outputs.version) }}
          name: SimpMusic ${{ steps.ver.outputs.version }}
          files: SimpMusic-*.apk
          generate_release_notes: true
